<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>칭찬 게임 🌟</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== 홈 화면 ===== -->
  <div id="screen-home" class="screen active">
    <div class="screen-inner">

      <!-- 상단 스트릭 배지 -->
      <div class="streak-badge" id="streakBadge">🔥 1일 연속!</div>

      <!-- 캐릭터 -->
      <div class="character-wrap">
        <div class="character" id="character">
          <div class="char-face">
            <div class="char-eyes">
              <div class="char-eye left"></div>
              <div class="char-eye right"></div>
            </div>
            <div class="char-blush left"></div>
            <div class="char-blush right"></div>
            <div class="char-mouth"></div>
          </div>
          <div class="char-body"></div>
          <div class="char-hands">
            <div class="char-hand left"></div>
            <div class="char-hand right"></div>
          </div>
        </div>
        <div class="character-shadow"></div>
      </div>

      <!-- 레벨 정보 -->
      <div class="level-card">
        <div class="level-header">
          <span class="level-label">현재 레벨</span>
          <span class="level-num" id="homeLevelNum">Lv. 1</span>
        </div>
        <div class="xp-bar-wrap">
          <div class="xp-bar" id="homeXpBar" style="width: 0%"></div>
        </div>
        <div class="xp-text" id="homeXpText">경험치 0 / 100</div>
      </div>

      <!-- 시작 버튼 -->
      <button class="btn btn-primary btn-large" id="btnStartChallenge">
        ✨ 오늘의 도전 시작하기
      </button>

      <!-- 기록 보기 버튼 -->
      <button class="btn btn-ghost" id="btnViewHistory">
        📖 최근 기록 보기
      </button>

    </div>
  </div>

  <!-- ===== 도전 화면 ===== -->
  <div id="screen-challenge" class="screen">
    <div class="screen-inner">

      <button class="btn-back" id="btnBackFromChallenge">← 뒤로</button>

      <div class="challenge-header">
        <h1 class="title">오늘 잘한 일이<br/>뭐가 있나요? 🌈</h1>
        <p class="subtitle">아주 작은 것도 괜찮아요!</p>
      </div>

      <!-- 텍스트 입력창 -->
      <div class="input-wrap">
        <textarea
          id="achievementInput"
          class="input-textarea"
          placeholder="예) 밥을 끝까지 먹었어요, 오늘 일어났어요, 친구에게 먼저 연락했어요..."
          maxlength="200"
        ></textarea>
        <div class="char-count" id="charCount">0 / 200</div>
      </div>

      <!-- 감정 선택 -->
      <div class="emotion-section">
        <p class="emotion-label">지금 기분은?</p>
        <div class="emotion-buttons">
          <button class="btn-emotion" data-emotion="행복" data-emoji="😊">
            <span class="emotion-emoji">😊</span>
            <span class="emotion-text">행복</span>
          </button>
          <button class="btn-emotion" data-emotion="뿌듯" data-emoji="😤">
            <span class="emotion-emoji">😤</span>
            <span class="emotion-text">뿌듯</span>
          </button>
          <button class="btn-emotion" data-emotion="평온" data-emoji="😌">
            <span class="emotion-emoji">😌</span>
            <span class="emotion-text">평온</span>
          </button>
          <button class="btn-emotion" data-emotion="힘듦" data-emoji="😔">
            <span class="emotion-emoji">😔</span>
            <span class="emotion-text">힘듦</span>
          </button>
        </div>
      </div>

      <!-- 제출 버튼 -->
      <button class="btn btn-primary btn-large" id="btnSubmitPraise">
        🎁 칭찬 받기
      </button>

    </div>
  </div>

  <!-- ===== 칭찬 결과 화면 ===== -->
  <div id="screen-result" class="screen">
    <!-- 컨페티 컨테이너 -->
    <div class="confetti-container" id="confettiContainer"></div>

    <div class="screen-inner">

      <!-- 칭찬 카드 -->
      <div class="praise-card" id="praiseCard">
        <div class="praise-icon" id="praiseIcon">⭐</div>
        <p class="praise-achievement" id="praiseAchievement"></p>
        <div class="praise-divider"></div>
        <p class="praise-message" id="praiseMessage"></p>
        <div class="praise-emotion-tag" id="praiseEmotionTag"></div>
      </div>

      <!-- 경험치 획득 애니메이션 -->
      <div class="xp-gain" id="xpGain">
        <span id="xpGainText">+10 XP</span>
      </div>

      <!-- 레벨업 팝업 -->
      <div class="levelup-popup" id="levelupPopup">
        <div class="levelup-inner">
          <div class="levelup-star">🌟</div>
          <h2 class="levelup-title">레벨 업!</h2>
          <p class="levelup-level" id="levelupNewLevel">Lv. 2 달성!</p>
          <p class="levelup-message" id="levelupMessage"></p>
          <button class="btn btn-primary" id="btnCloseLevelup">확인</button>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="result-buttons">
        <button class="btn btn-secondary" id="btnAgain">🔄 다시 도전</button>
        <button class="btn btn-primary" id="btnGoHome">🏠 홈으로</button>
      </div>

    </div>
  </div>

  <!-- ===== 기록 화면 ===== -->
  <div id="screen-history" class="screen">
    <div class="screen-inner">

      <button class="btn-back" id="btnBackFromHistory">← 뒤로</button>

      <h1 class="title">나의 칭찬 기록 📚</h1>
      <p class="subtitle">최근 7일간의 기록이에요</p>

      <div class="history-list" id="historyList">
        <!-- 기록 카드들이 여기에 동적으로 삽입됩니다 -->
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
